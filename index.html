<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulador da convocação em lotes do TJCE (AJAJ e Técnico I09), 2027–2029.">
<title>Convocação TJCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: painel de premissas fixo à esquerda + quadro de convocação (resumo, linha do tempo dos lotes, ordem) à direita */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f4f6f9; --line:#d8dde6; --line-2:#e7eaf0;
  --fg:#161d2b; --muted:#5a6476; --faint:#8a93a3;
  --accent:#233f8c; --accent-soft:#e3e9f8; --accent-fg:#ffffff;
  --red:#c42318; --amber:#a85700; --amber-soft:#fff1de; --green:#16784a; --green-soft:#e2f4ea;
  --comp:#7a4bb5; --refuse:#8a93a3;
  --lc-l:46%; --lc-s:62%; --tint:9%;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#151b26; --surface-2:#1b2230; --line:#2a3445; --line-2:#222b3a;
  --fg:#e5e9f1; --muted:#9aa4b6; --faint:#6c7689;
  --accent:#9cb3ff; --accent-soft:#1f2a47; --accent-fg:#0e131b;
  --red:#ff6d63; --amber:#f2a64a; --amber-soft:#3a2a12; --green:#55cf8d; --green-soft:#14301f;
  --comp:#b994ee; --refuse:#6c7689; --lc-l:58%; --lc-s:58%; --tint:14%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#151b26; --surface-2:#1b2230; --line:#2a3445; --line-2:#222b3a;
  --fg:#e5e9f1; --muted:#9aa4b6; --faint:#6c7689;
  --accent:#9cb3ff; --accent-soft:#1f2a47; --accent-fg:#0e131b;
  --red:#ff6d63; --amber:#f2a64a; --amber-soft:#3a2a12; --green:#55cf8d; --green-soft:#14301f;
  --comp:#b994ee; --refuse:#6c7689; --lc-l:58%; --lc-s:58%; --tint:14%; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{padding-inline:16px;padding-block:14px 40px;max-width:1680px;margin:0 auto}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{min-width:0;flex:1 1 280px}
.eyebrow{font:600 11px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font:780 30px/1.05 var(--f-display);font-stretch:80%;letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px}

.layout{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}

/* painel de premissas */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px);overflow:auto}
@media (max-width:1000px){.panel{position:static;max-height:none}.panel.collapsed .pbody{display:none}}
.phead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2);gap:8px}
.phead h2{font:700 15px/1.2 var(--f-display);font-stretch:90%;margin:0;letter-spacing:.01em}
.ptoggle{display:none}
@media (max-width:1000px){.ptoggle{display:inline-block}}
.psec{padding:12px 14px;border-bottom:1px solid var(--line-2);display:grid;gap:8px}
.psec h3{font:650 11px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.fld{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:13px}
.fld small{display:block;color:var(--faint);font-size:11.5px;line-height:1.3}
.fld input,.fld select{width:100%}
input[type=number],input[type=text],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:5px 7px;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.ytbl{width:100%;border-collapse:collapse;font-size:12.5px}
.ytbl th{font-weight:600;color:var(--muted);text-align:right;padding:3px 4px;font-size:11px}
.ytbl th:first-child,.ytbl td:first-child{text-align:left}
.ytbl td{padding:3px 4px;text-align:right}
.ytbl input{width:100%;max-width:70px;padding:3px 5px}
.out{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.out.strong{color:var(--fg);font-weight:600}
.ycard{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;display:grid;gap:6px;background:var(--surface-2)}
.yhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.yhead b{font:700 14px var(--f-display);font-stretch:90%}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:26px;height:26px;cursor:pointer;font-weight:700}
.stepper span{min-width:58px;text-align:center;font-size:12px}
.lrow{display:grid;grid-template-columns:14px 34px minmax(0,1fr) 76px;gap:6px;align-items:center;font-size:12.5px}
.lrow .sw{width:12px;height:12px;border-radius:3px;background:var(--lc)}
.lrow select{padding:3px 4px}
.lrow input{padding:3px 5px}
.lrow .auto{font-family:var(--f-mono);text-align:right;padding-right:6px;color:var(--muted)}
.warnline{color:var(--red);font-size:12px}
.note{font-size:12px;color:var(--muted);line-height:1.45}

/* resumo */
.main{min-width:0;display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font:760 26px/1.1 var(--f-display);font-stretch:85%;font-variant-numeric:tabular-nums;margin-top:3px}
.kpi .s{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.card h2{font:720 15px/1.2 var(--f-display);font-stretch:90%;margin:0}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 14px 8px}
.chead .note{max-width:70ch}
.scroll{overflow-x:auto}
.sumtbl{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
.sumtbl th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.sumtbl td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line-2);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sumtbl th:first-child,.sumtbl td:first-child{text-align:left;font-family:var(--f-body);font-weight:600}
.sumtbl tr.tot td{font-weight:700;border-bottom:0}
.sumtbl .grp{border-left:1px solid var(--line-2)}

/* linha do tempo */
.tl{padding:4px 14px 14px;display:grid;gap:8px}
.tlrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center}
.tlrow .yr{font:700 14px var(--f-display);font-stretch:85%;color:var(--muted)}
.tlbar{display:flex;gap:3px;min-width:0}
.blk{flex:var(--g) 1 0;min-width:30px;border:0;border-radius:5px;background:hsl(var(--h) var(--lc-s) var(--lc-l));color:#fff;padding:5px 6px;text-align:left;cursor:pointer;overflow:hidden;line-height:1.15;font-size:11px}
.blk b{display:block;font:700 13px var(--f-display);font-stretch:85%}
.blk span{opacity:.9;white-space:nowrap}
.blk.comp{flex:0 0 auto;min-width:34px;background:repeating-linear-gradient(135deg,var(--comp) 0 5px,color-mix(in oklab,var(--comp) 70%,var(--surface)) 5px 10px)}
.blk.sel{outline:2px solid var(--fg);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:0 14px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* barra e tabela */
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.tbar input[type=search]{flex:1 1 220px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.tbar select{padding:6px 8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:3px 4px 3px 10px;font-size:12px}
.chip button{border:0;background:var(--surface);border-radius:999px;width:20px;height:20px;cursor:pointer}
.count{font-size:12px;color:var(--muted);margin-left:auto}
table.ord{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:980px}
table.ord thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ord th.r,table.ord td.r{text-align:right}
table.ord td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr.g td{background:color-mix(in oklab,hsl(var(--h) var(--lc-s) var(--lc-l)) 16%,var(--surface));border-top:2px solid hsl(var(--h) var(--lc-s) var(--lc-l));padding:8px 8px;font-size:12.5px;color:var(--fg)}
tr.g.comp td{background:color-mix(in oklab,var(--comp) 14%,var(--surface));border-top-color:var(--comp)}
tr.g.tail td{background:var(--surface-2);border-top-color:var(--line)}
tr.g b{font:720 14px var(--f-display);font-stretch:88%;margin-right:8px}
tr.g .gm{color:var(--muted)}
tr.g button{margin-left:8px}
tr.p{cursor:pointer;background:color-mix(in oklab,hsl(var(--h) var(--lc-s) var(--lc-l)) var(--tint),var(--surface))}
tr.p td:first-child{box-shadow:inset 4px 0 0 hsl(var(--h) var(--lc-s) var(--lc-l))}
tr.p.comp{background:color-mix(in oklab,var(--comp) var(--tint),var(--surface))}
tr.p.comp td:first-child{box-shadow:inset 4px 0 0 var(--comp)}
tr.p.tail{background:var(--surface)}
tr.p.tail td:first-child{box-shadow:inset 4px 0 0 var(--line)}
tr.p:hover td{background:color-mix(in oklab,var(--accent) 7%,transparent)}
tr.p.refuse{color:var(--muted)}
tr.p.refuse .name{text-decoration:line-through;text-decoration-color:var(--faint)}
tr.p.istd .name{text-decoration:line-through;text-decoration-color:var(--amber);text-decoration-thickness:2px}
tr.p.ph{cursor:default;color:var(--muted);font-style:italic}
td.pos{font-family:var(--f-mono);font-weight:600;white-space:nowrap;padding-left:12px!important}
td.pos small{display:block;font-weight:400;font-size:10.5px;color:var(--muted)}
.name{font-weight:600}
.name.proj{color:var(--red)}
.meta{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35;max-width:62ch}
.meta .k{color:var(--fg);font-weight:600}
.badge{display:inline-block;font:600 10.5px/1 var(--f-mono);padding:3px 5px;border-radius:4px;border:1px solid var(--fg);letter-spacing:.02em}
.badge.ghost{border-color:var(--line);color:var(--muted);margin-left:3px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.tag.td{background:var(--amber);color:var(--surface)}
.tag.sub{background:var(--comp);color:var(--surface)}
.tag.ed{background:var(--accent-soft);color:var(--accent)}
.tag.ref{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag.out{background:var(--green-soft);color:var(--green)}
.adv{font:600 12px var(--f-mono);white-space:nowrap;display:block}
.adv.up{color:var(--green)}
.adv.dn{color:var(--red)}
.adv.t{font-size:10.5px;color:var(--muted);font-weight:500}
.lchip{display:inline-block;font:700 11px/1 var(--f-mono);padding:4px 6px;border-radius:4px;background:hsl(var(--h) var(--lc-s) var(--lc-l));color:#fff;white-space:nowrap}
.lchip.comp{background:var(--comp)}
.lchip.tail{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tdbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:5px;font:700 11px var(--f-mono);padding:4px 7px;cursor:pointer;color:var(--muted)}
.tdbtn:hover{border-color:var(--amber);color:var(--amber)}
.tdbtn.on{background:var(--amber);border-color:var(--amber);color:var(--surface)}
.tit.edited{color:var(--accent);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* gaveta */
.drawer{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end;background:color-mix(in oklab,#000 35%,transparent)}
.dpanel{width:min(480px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:14px;align-content:start}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dhead h2{font:760 22px/1.1 var(--f-display);font-stretch:82%;margin:2px 0 4px;text-wrap:balance}
.dhead h2.proj{color:var(--red)}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dgrid div{background:var(--surface-2);border-radius:8px;padding:8px 10px;min-width:0}
.dgrid .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dgrid .v{font:720 18px/1.2 var(--f-display);font-stretch:85%;font-variant-numeric:tabular-nums}
.dsec{border-top:1px solid var(--line-2);padding-top:12px;display:grid;gap:8px}
.dsec h3{font:650 11px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.dsec p{margin:0;font-size:13px;line-height:1.5}
.titrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.titrow input{width:96px}
.tdbig{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.tdbig.on{border-color:var(--amber);background:var(--amber-soft)}
.tdbig .box{width:20px;height:20px;border-radius:4px;border:2px solid var(--amber);flex:none;display:grid;place-items:center;font-weight:800;color:var(--surface)}
.tdbig.on .box{background:var(--amber)}
.callout{background:var(--surface-2);border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.5}
.callout.green{background:var(--green-soft)}
.callout.amber{background:var(--amber-soft)}
.callout.comp{background:color-mix(in oklab,var(--comp) 14%,var(--surface))}
label.ck{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}

/* modal */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in oklab,#000 40%,transparent);padding:16px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:16px;display:grid;gap:10px}
.mbox textarea{width:100%;min-height:220px;font:12px/1.4 var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50}
@media (prefers-reduced-motion:no-preference){.blk,.tdbtn,.btn{transition:filter .12s,border-color .12s,background .12s}.blk:hover{filter:brightness(1.08)}}
</style>


</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">TJCE · concurso 2026 · projeção 2027–2029</div>
      <h1>Convocação em lotes · <em id="h1cargo">Analista Judiciário</em></h1>
    </div>
    <nav class="seg" role="tablist" aria-label="Cargo">
      <button id="tab-aj" role="tab" data-cargo="aj" aria-selected="true">Analista · AJAJ</button>
      <button id="tab-tec" role="tab" data-cargo="tec" aria-selected="false">Técnico · I09</button>
    </nav>
    <div class="actions">
      <button class="btn" id="btnExport">Exportar cenário</button>
      <button class="btn" id="btnImport">Importar</button>
      <button class="btn" id="btnReset">Restaurar padrão</button>
    </div>
  </header>
  <div class="layout">
    <aside class="panel collapsed" id="panel" aria-label="Premissas e lotes"></aside>
    <main class="main">
      <section class="kpis" id="kpis"></section>
      <section class="card" id="sumcard"></section>
      <section class="card" id="tlcard"></section>
      <section class="card">
        <div class="tbar" id="tbar"></div>
        <div class="scroll" id="tblwrap"></div>
      </section>
    </main>
  </div>
</div>
<div class="drawer" id="drawer" hidden><div class="dpanel" id="dpanel" role="dialog" aria-modal="true"></div></div>

<script>
// ===== Motor de simulação (puro, sem DOM) =====
const LT = ['A', 'N', 'P', 'I', 'Q'];
const LNAME = { A: 'AC', N: 'NEG', P: 'PCD', I: 'IND', Q: 'QUI' };
const LLONG = { A: 'Ampla concorrência', N: 'Negros', P: 'Pessoas com deficiência', I: 'Indígenas', Q: 'Quilombolas' };
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const FALLBACK_AJ = { A: ['N', 'P', 'I', 'Q'], N: ['I', 'Q', 'A'], P: ['A'], I: ['N', 'Q', 'A'], Q: ['N', 'I', 'A'] };

function fmtDate(d) {
  if (d == null || !isFinite(d)) return 'após o período';
  return MES[((d % 12) + 12) % 12] + '/' + Math.floor(d / 12);
}
function patternAt(PAT, n) {
  if (n <= PAT.length) return PAT[n - 1];
  return PAT[400 + ((n - 501) % 100 + 100) % 100];
}

// ---- totais anuais ----
function ajajYears(P, nPeople) {
  const out = []; let acum = 0, usedSum = 0;
  const part = P.criados > 0 ? P.novos / P.criados : 0;
  P.years.forEach((Y, i) => {
    const novos = (Y.novos === null || Y.novos === '' || Y.novos === undefined) ? P.novos : +Y.novos;
    const quadro = P.quadro2025 + P.criados * (Y.y - 2025);
    const vac = P.cenario === 'Print' ? P.vacPrint * 3 : quadro * (P.taxas[P.cenario] || 0) * part;
    const cargos = novos + vac;
    const pos = cargos / (1 - Math.min(0.95, Y.desist));
    acum += pos;
    const est = Math.max(0, Math.round(acum) - usedSum);
    const manual = (Y.manual === null || Y.manual === '' || Y.manual === undefined) ? null : Math.max(0, Math.round(+Y.manual));
    const used = manual != null ? manual : est;
    usedSum += used;
    out.push({ y: Y.y, novos, quadro, vac, cargos, pos, est, manual, used });
  });
  return out;
}

function tecYears(P, reab) {
  const out = []; let acum = 0, usedSum = 0;
  P.years.forEach((Y, i) => {
    const novos = +Y.novos || 0;
    const quadro = P.quadro2025 + P.criados * (Y.y - 2025);
    const vac = quadro * (P.taxas[P.cenario] || 0) * P.part;
    const est0 = i === 0 ? P.estoque + P.tecAjaj : 0;
    const r = reab[Y.y] || 0;
    const cargos = est0 + novos + vac + r;
    const pos = cargos / (1 - Math.min(0.95, P.desist));
    acum += pos;
    const need = Math.max(0, Math.round(acum) - usedSum);
    const teto = (Y.teto === null || Y.teto === '' || Y.teto === undefined) ? Infinity : +Y.teto;
    const est = Math.min(teto, need);
    const manual = (Y.manual === null || Y.manual === '' || Y.manual === undefined) ? null : Math.max(0, Math.round(+Y.manual));
    const used = manual != null ? manual : est;
    usedSum += used;
    out.push({ y: Y.y, novos, quadro, vac, estoque: est0, reab: r, cargos, pos, need, est, manual, used, pend: Math.max(0, Math.round(acum) - usedSum) });
  });
  return out;
}

// ---- lotes a partir da configuração ----
function buildLotes(yearsCfg, totals) {
  const lotes = []; let slot = 1, id = 1;
  yearsCfg.forEach((Y, yi) => {
    const tot = totals[yi].used;
    const n = Y.lotes.length;
    let sumOthers = 0;
    Y.lotes.forEach((L, k) => { if (k < n - 1) sumOthers += Math.max(0, Math.round(+L.s || 0)); });
    const lastSize = Math.max(0, tot - sumOthers);
    totals[yi].over = Math.max(0, sumOthers - tot);
    totals[yi].lastSize = lastSize;
    let yearCalled = 0;
    Y.lotes.forEach((L, k) => {
      const size = k === n - 1 ? lastSize : Math.max(0, Math.round(+L.s || 0));
      yearCalled += size;
      if (size <= 0) return;
      lotes.push({ id: id++, y: Y.y, k: k + 1, m: L.m, date: Y.y * 12 + (L.m - 1), start: slot, size, yi });
      slot += size;
    });
    totals[yi].called = yearCalled;
  });
  return lotes;
}

// ---- simulação por eventos (lotes regulares + complementares de TD) ----
// opt: {n, lists:{t:[idx]}, lotes, PAT, td:Set, delay, refuse(i,date), fallback, placeholders, exclude:{i:t}}
function simulate(opt) {
  const { n, lists, lotes, PAT, td, delay } = opt;
  const rec = new Array(n);
  const ptr = { A: 0, N: 0, P: 0, I: 0, Q: 0 };
  const beyond = { A: 0, N: 0, P: 0, I: 0, Q: 0 };
  const calls = [];       // chamadas em ordem cronológica
  const compLotes = {};   // date -> {date, calls:[]}
  const excl = opt.exclude || {};
  let lastSlot = 0, seq = 0;

  function take(t, date, ctx, noPh) {
    const chain = [t].concat(opt.fallback ? (opt.fallback[t] || []) : []);
    for (const tt of chain) {
      const L = lists[tt] || [];
      while (ptr[tt] < L.length) {
        const i = L[ptr[tt]];
        if (rec[i] || excl[i] === tt) { ptr[tt]++; continue; }
        if (opt.refuse && opt.refuse(i, date)) {
          rec[i] = { type: 'refuse', date, lote: ctx.lote, via: tt, atSlot: ctx.slot, comp: !!ctx.comp, tail: !!ctx.tail };
          ptr[tt]++;
          continue;
        }
        ptr[tt]++;
        return { i, via: tt };
      }
      if (opt.placeholders) {
        if (noPh) return { ph: tt, k: ++beyond[tt], via: tt, hidden: true };
        return { ph: tt, k: ++beyond[tt], via: tt };
      }
    }
    return null;
  }

  const comps = [];
  function processLote(L) {
    for (let s = L.start; s < L.start + L.size; s++) {
      const t = patternAt(PAT, s);
      const r = take(t, L.date, { lote: L.id, slot: s });
      lastSlot = s;
      if (!r) continue;
      const c = { slot: s, via: r.via, lote: L.id, date: L.date, comp: false, slotType: t };
      if (r.ph) { c.ph = r.ph; c.k = r.k; }
      else {
        c.i = r.i; rec[r.i] = { type: 'call', slot: s, via: r.via, lote: L.id, date: L.date, comp: false, slotType: t };
        if (td.has(r.i)) comps.push({ date: L.date + delay, via: r.via, replaces: r.i, slot: s, seq: seq++ });
      }
      calls.push(c);
    }
  }
  function processComp(cp) {
    const r = take(cp.via, cp.date, { lote: 'C' + cp.date, slot: cp.slot, comp: true });
    if (!r) return;
    const key = 'C' + cp.date;
    if (!compLotes[key]) compLotes[key] = { id: key, date: cp.date, comp: true, calls: [] };
    const c = { slot: cp.slot, via: r.via, lote: key, date: cp.date, comp: true, replaces: cp.replaces };
    if (r.ph) { c.ph = r.ph; c.k = r.k; }
    else {
      c.i = r.i;
      rec[r.i] = { type: 'call', slot: cp.slot, via: r.via, lote: key, date: cp.date, comp: true, replaces: cp.replaces };
      if (td.has(r.i)) comps.push({ date: cp.date + delay, via: r.via, replaces: r.i, slot: cp.slot, seq: seq++ });
    }
    rec[cp.replaces].replacedBy = c;
    compLotes[key].calls.push(c);
    calls.push(c);
  }

  let ri = 0;
  const regs = lotes.slice().sort((a, b) => a.date - b.date || a.id - b.id);
  while (ri < regs.length || comps.length) {
    if (comps.length > 1) comps.sort((a, b) => a.date - b.date || a.seq - b.seq);
    if (comps.length && (ri >= regs.length || comps[0].date <= regs[ri].date)) processComp(comps.shift());
    else processLote(regs[ri++]);
  }
  const horizonSlot = lastSlot;

  // cauda: ordem depois do período (sem datas)
  let s = lastSlot + 1; const maxSlot = lastSlot + n * 3 + 50;
  const left = () => { let c = 0; for (let i = 0; i < n; i++) if (!rec[i]) c++; return c; };
  let remaining = left();
  while (remaining > 0 && s <= maxSlot) {
    const t = patternAt(PAT, s);
    const r = take(t, Infinity, { lote: 'T', slot: s, tail: true }, true);
    if (r && r.i != null) {
      rec[r.i] = { type: 'call', slot: s, via: r.via, lote: 'T', date: null, comp: false, tail: true, slotType: t };
    }
    if (!r) break;
    if (s % 50 === 0) remaining = left();
    s++;
  }
  return { rec, calls, compLotes, horizonSlot, beyond };
}

// ---- listas ordenadas (AJAJ: total com títulos desc, nota preliminar desc, ordem original) ----
function ajajLists(people) {

  const td = new Set(res.td); td.add(i);
  let s;
  if (res.kind === 'aj') s = simulate({ ...res.opt, td });
  else s = simulate({ n: res.people.length, lists: res.lists, lotes: res.lotes, PAT: D.pat, td, delay: res.delay, refuse: res.refuse, placeholders: true });
  const rb = s.rec[i] && s.rec[i].replacedBy;
  let gained = 0, moved = 0; res.people.forEach((p, j) => { const a = res.cur.rec[j], b = s.rec[j]; if (j !== i && a && b && a.type === 'call' && b.type === 'call' && a.slot > b.slot) { gained++; if (b.date != null && a.lote !== b.lote) moved++; } });
  return { rb, gained, moved };
}
function renderDrawer() {
  if (drawerI == null) return;
  const res = R(), i = drawerI, p = res.people[i], r = res.cur.rec[i], b = res.base.rec[i];
  const isAJ = res.kind === 'aj', td = res.td.has(i);
  let h = `<div class="dhead"><div><div class="eyebrow">${isAJ ? 'Analista Judiciário · AJAJ' : 'Técnico Judiciário · I09'} · inscrição ${esc(p.insc)}</div>
    <h2 class="${isAJ && p.proj ? 'proj' : ''}">${esc(p.name)}</h2>
    <div>${(isAJ ? p.lists : [p.list]).map(t => `<span class="badge ${r && r.via === t ? '' : 'ghost'}" title="${LLONG[t]}">${LNAME[t]}</span>`).join(' ')}</div></div>
    <button class="btn" data-act="close" aria-label="Fechar">Fechar</button></div>`;
  const loteTxt = r ? (r.lote === 'T' ? 'Após o período' : String(r.lote)[0] === 'C' ? 'Complementar' : 'Lote ' + r.lote) : '—';
  h += `<div class="dgrid"><div><div class="k">Posição</div><div class="v">${r && r.type === 'call' ? r.slot + 'ª' : '—'}</div></div>
    <div><div class="k">${loteTxt}</div><div class="v">${r && r.date != null && isFinite(r.date) ? fmtDate(r.date) : '—'}</div></div>
    <div><div class="k">Vaga</div><div class="v">${r ? LNAME[r.via] : '—'} ${isAJ && r ? res.ranks[r.via].get(i) + 'º' : !isAJ ? p.cls + 'º' : ''}</div></div></div>`;
  // avanço
  const adv = [];
  if (r && b && r.type === 'call' && b.type === 'call' && b.slot !== r.slot) adv.push(`Por causa dos TDs marcados, ${b.slot > r.slot ? `<b>avança ${b.slot - r.slot} posições</b>` : `recua ${r.slot - b.slot}`} (sem TDs seria a ${b.slot}ª${b.date != null ? `, ${fmtDate(b.date)}` : ''}).`);
  if (isAJ && b && ORIG_AJ[i] !== b.slot) adv.push(`Com os títulos editados, ${ORIG_AJ[i] > b.slot ? 'sobe' : 'desce'} ${Math.abs(ORIG_AJ[i] - b.slot)} posições (na planilha era a ${ORIG_AJ[i]}ª).`);
  if (!isAJ && r && r.type === 'call') { const a = p.pdf - r.slot; if (a) adv.push(`Na ordem efetiva ${a > 0 ? 'adianta' : 'atrasa'} ${Math.abs(a)} posições em relação ao PDF (${p.pdf}ª) por causa de recusas de quem já está em AJAJ.`); }
  if (r && r.comp) adv.push(`Chamado(a) no lote complementar de ${fmtDate(r.date)} no lugar de <b>${esc(personName(res, r.replaces))}</b> (TD), ocupando a vaga ${r.slot}.`);
  if (adv.length) h += `<div class="callout green">${adv.join('<br>')}</div>`;
  if (r && r.type === 'refuse') h += `<div class="callout">Quando chega a vez no técnico (${fmtDate(r.date)}), já foi convocado(a) em AJAJ (${fmtDate(p.ajDate)}): recusa, e a vaga passa ao próximo da lista ${LNAME[r.via]} sem contar posição.</div>`;

  // TD
  if (r && r.type === 'call') {
    h += `<div class="dsec"><h3>Termo de desistência</h3><button class="tdbig ${td ? 'on' : ''}" data-td="${i}" aria-pressed="${td}"><span class="box">${td ? '✓' : ''}</span><span><b>${td ? 'Vai enviar TD' : 'Marcar que vai enviar TD'}</b><br><small>Desiste da vaga; o próximo da lista ${LNAME[r.via]} <b>ainda não convocado</b> entra num lote complementar ~${S[S.cargo].P.delay} mês(es) depois.</small></span></button>`;
    if (r.tail) h += `<p class="note">Esta pessoa só seria chamada depois de ${res.totals[res.totals.length - 1].y}; um TD dela não muda a convocação dentro do período.</p>`;
    else {
      const hy = td ? { rb: r.replacedBy, gained: null } : hypoTD(res, i);
      const rb = hy.rb;
      const Lr = typeof r.lote === 'number' ? loteById(res, r.lote) : null;
      const why = (Lr && rb && rb.i != null && res.base.rec[rb.i] && res.base.rec[rb.i].slot > Lr.start + Lr.size - 1)
        ? ` Quem vem logo depois na ${LNAME[r.via]} até a ${Lr.start + Lr.size - 1}ª posição já foi chamado(a) no mesmo lote ${Lr.id} (${fmtDate(Lr.date)}); por isso a vaga vai para o próximo da ${LNAME[r.via]} que ainda não tinha sido convocado(a).` : '';
      if (rb) h += `<div class="callout amber">${td ? 'Com o TD' : 'Se enviar TD'}, entra em ${fmtDate(rb.date)} (lote complementar): <b>${rb.i != null ? esc(personName(res, rb.i)) : 'próximo(a) da lista além do PDF'}</b>, da lista ${LNAME[rb.via]}${rb.i != null && res.base.rec[rb.i] ? `, que antes seria chamado(a) na ${res.base.rec[rb.i].slot}ª posição${res.base.rec[rb.i].date != null ? ` (${fmtDate(res.base.rec[rb.i].date)})` : ''}` : ''}.${hy.gained != null ? ` No total, ${hy.gained} pessoas avançariam na ordem; ${hy.moved} delas mudariam de lote dentro do período.` : ''}${why}</div>`;
    }
    const prev = r.comp ? null : prevSameType(r.slot, r.slotType || r.via);
    if (prev) h += `<p class="note">Cada pessoa da lista ${LNAME[r.slotType || r.via]} à sua frente que desistir antes da sua vez faz você avançar cerca de <b>${r.slot - prev} posiç${r.slot - prev === 1 ? 'ão' : 'ões'}</b> (a vaga anterior desse tipo é a ${prev}ª).</p>`;
    h += `</div>`;
  }
  if (isAJ) {
    const e = S.aj.edits[i] || {};
    h += `<div class="dsec"><h3>Títulos</h3>
      <p>Prova <b class="mono">${f2(p.pre)}</b> + títulos <b class="mono">${f2(p.tit)}</b> = <b class="mono">${f2(p.tot)}</b>${p.tit !== p.tit0 ? ` <span class="note">(original ${f2(p.tit0)})</span>` : ''}</p>
      <div class="titrow"><input type="number" id="dtit" step="0.25" min="0" max="10" value="${p.tit}" aria-label="Pontos de títulos"><button class="btn primary" data-act="saveTit">Atualizar</button><button class="btn warn" data-act="zeroTit">Excluir título</button>${S.aj.edits[i] ? `<button class="btn" data-act="restoreTit">Restaurar original</button>` : ''}</div>
      <label class="ck"><input type="checkbox" id="dproj" ${p.proj ? 'checked' : ''}> Título ainda é projeção (nome em vermelho)</label>
      <p class="note">${p.proj0 ? 'Na planilha, o título desta pessoa foi projetado por sorteio (não respondeu ao formulário).' : 'Na planilha, esta pessoa informou o título.'} Ao atualizar ou excluir, o título passa a contar como confirmado e a ordem é refeita.</p></div>`;
    const others = p.lists.filter(t => r && t !== r.via);
    if (r && r.type === 'call' && others.length) {
      const alt = simulate({ ...res.opt, td: res.td, exclude: { [i]: r.via } });
      const ar = alt.rec[i];
      h += `<div class="dsec"><h3>Ampla × cota</h3><p>Está nas listas ${p.lists.map(t => LNAME[t]).join(' e ')}. A vez chega primeiro pela <b>${LNAME[r.via]}</b> (${r.slot}ª posição).${ar && ar.type === 'call' ? ` Pela ${LNAME[ar.via]}, seria a ${ar.slot}ª${ar.date != null ? ` (${fmtDate(ar.date)})` : ' (após o período)'}.` : ''}</p>
        <p class="note">${r.via === 'A' ? `Como entra pela ampla, não gasta vaga de ${others.map(t => LNAME[t]).join('/')}: a cota chama o próximo cotista.` : 'Como entra pela cota, não gasta vaga da ampla: a ampla chama o próximo da lista.'}</p></div>`;
    }
    if (AJ2TEC[i] != null) {
      const t = TC.people[AJ2TEC[i]], tr = TC.cur.rec[AJ2TEC[i]];
      h += `<div class="dsec"><h3>Também em Técnico</h3><p>${t.pdf}ª no PDF de técnico (${LNAME[t.list]} ${t.cls}º). ${tr ? (tr.type === 'refuse' ? `Recusa o técnico em ${fmtDate(tr.date)} porque já foi chamado(a) aqui.` : tr.date != null && isFinite(tr.date) ? `Chamado(a) no técnico em ${fmtDate(tr.date)}${t.entry != null && t.entry > tr.date ? `, assume e sai quando vem AJAJ` : ''}.` : 'Chamado(a) no técnico só depois do período.') : ''}</p><button class="btn sm" data-act="goTec" data-j="${AJ2TEC[i]}">Ver na aba de Técnico</button></div>`;
    }
  } else {
    h += `<div class="dsec"><h3>Nota</h3><p>Objetiva <b class="mono">${f2(p.obj)}</b> + discursiva <b class="mono">${f2(p.disc)}</b> = <b class="mono">${f2(p.tot)}</b> · ${LNAME[p.list]} ${p.cls}º · ${p.pdf}ª no PDF</p></div>`;
    if (p.aj >= 0) {
      h += `<div class="dsec"><h3>Também aprovado(a) em AJAJ</h3><p>${p.ajSlot ? p.ajSlot + 'ª' : '—'} na ordem de AJAJ${p.ajTd ? ' · marcado(a) com TD em AJAJ, então fica no técnico' : p.ajDate != null ? ` · convocação em AJAJ ≈ ${fmtDate(p.ajDate)}` : ' · sem convocação em AJAJ no período/corte'}.</p>
        <label class="ck"><input type="checkbox" id="dadia" ${p.adia ? 'checked' : ''}> Adia a posse em AJAJ por ${S.tec.P.mesesAdia} meses (ex.: ainda na faculdade)</label>
        ${p.entry != null ? `<p class="note">${r && r.type === 'refuse' ? 'Recusa o técnico.' : `Assume o técnico e sai em ${fmtDate(p.entry)}; a vaga reabre ≈ ${fmtDate(p.entry + (+S.tec.P.mesesSaida || 0))} e entra na conta do ano.`}</p>` : ''}
        <button class="btn sm" data-act="goAj" data-j="${p.aj}">Ver na aba de Analista</button></div>`;
    }
  }
  $('#dpanel').innerHTML = h;
}

// ---------- render geral ----------
function renderAll(panelToo) {
  $('#tab-aj').setAttribute('aria-selected', S.cargo === 'aj'); $('#tab-tec').setAttribute('aria-selected', S.cargo === 'tec');
  $('#h1cargo').textContent = S.cargo === 'aj' ? 'Analista Judiciário' : 'Técnico Judiciário';
  if (panelToo) renderPanel(); else renderOutputs();
  renderSummary(); renderTable(); renderDrawer();
}
function update(panelToo) { recompute(); save(); renderAll(panelToo); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }

function setPath(path, val) {
  const ks = path.split('.'); let o = S;
  for (let k = 0; k < ks.length - 1; k++) o = o[ks[k]];
  o[ks[ks.length - 1]] = val;
}

// ---------- eventos ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-cargo],[data-td],[data-act],[data-lote],tr.p[data-i]');
  if (!t) { if (e.target.id === 'drawer') closeDrawer(); if (e.target.id === 'modal') $('#modal').hidden = true; return; }
  if (t.dataset.cargo) { if (S.cargo !== t.dataset.cargo) { S.cargo = t.dataset.cargo; S.ui.lote = null; S.ui.show = ''; S.ui.lista = ''; closeDrawer(); save(); renderAll(true); } return; }
  if (t.dataset.td != null) {
    e.stopPropagation();
    const i = +t.dataset.td, o = S[S.cargo].td;
    if (o[i]) delete o[i]; else o[i] = 1;
    update(true);
    toast(o[i] ? `TD marcado: ${personName(R(), i)}` : 'TD removido');
    return;
  }
  if (t.dataset.lote) { const v = t.dataset.lote[0] === 'C' ? t.dataset.lote : +t.dataset.lote; S.ui.lote = S.ui.lote === v ? null : v; save(); renderSummary(); renderTable(); return; }
  if (t.matches('tr.p[data-i]')) { openDrawer(+t.dataset.i); return; }
  const act = t.dataset.act, c = S.cargo, P = S[c].P;
  switch (act) {
    case 'close': closeDrawer(); break;
    case 'ptoggle': $('#panel').classList.toggle('collapsed'); break;
    case 'clearLote': S.ui.lote = null; save(); renderSummary(); renderTable(); break;
    case 'tail': S.ui.tail = !S.ui.tail; save(); renderTable(); break;
    case 'lotesN': {
      const yi = +t.dataset.yi, Y = P.years[yi], n = Math.max(1, Math.min(12, Y.lotes.length + +t.dataset.d));
      if (n === Y.lotes.length) break;
      const tot = R().totals[yi].used, ms = spreadMonths(n), sz = Math.floor(tot / n);
      Y.lotes = ms.map(m => ({ m, s: sz }));
      update(true); break;
    }
    case 'addYear': {
      const L = P.years[P.years.length - 1];
      const Y = JSON.parse(JSON.stringify(L)); Y.y = L.y + 1; Y.manual = null;
      P.years.push(Y); update(true); break;
    }
    case 'rmYear': if (P.years.length > 1) { P.years.pop(); update(true); } break;
    case 'clearTd': S[c].td = {}; update(true); toast('TDs removidos'); break;
    case 'clearEdits': S.aj.edits = {}; update(true); toast('Títulos voltaram aos valores da planilha'); break;
    case 'saveTit': case 'zeroTit': {
      const v = act === 'zeroTit' ? 0 : Math.max(0, +$('#dtit').value || 0);
      S.aj.edits[drawerI] = { tit: r2(v), proj: 0 };
      update(true); toast(act === 'zeroTit' ? 'Título excluído; ordem refeita' : 'Título atualizado; ordem refeita'); break;
    }
    case 'restoreTit': delete S.aj.edits[drawerI]; update(true); break;
    case 'goTec': S.cargo = 'tec'; S.ui.lote = null; S.ui.show = ''; S.ui.lista = ''; save(); renderAll(true); openDrawer(+t.dataset.j); break;
    case 'goAj': S.cargo = 'aj'; S.ui.lote = null; S.ui.show = ''; S.ui.lista = ''; save(); renderAll(true); openDrawer(+t.dataset.j); break;
    case 'resetYes': S = defaults(); closeDrawer(); $('#modal').hidden = true; update(true); toast('Cenário padrão restaurado'); break;
    case 'mclose': $('#modal').hidden = true; break;
    case 'copy': {
      const ta = $('#mtext'); const txt = ta.value;
      const done = () => toast('Copiado');
      try { navigator.clipboard.writeText(txt).then(done, () => { ta.select(); toast('Selecionado: use Ctrl+C'); }); } catch (err) { ta.select(); toast('Selecionado: use Ctrl+C'); }
      break;
    }
    case 'doImport': {
      try { applyState(JSON.parse($('#mtext').value)); $('#modal').hidden = true; closeDrawer(); update(true); toast('Cenário importado'); }
      catch (err) { $('#merr').textContent = 'Não consegui ler esse texto. Cole o JSON exportado por esta página.'; }
      break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); $('#modal').hidden = true; }
  if (e.key === 'Enter' && e.target.matches('tr.p[data-i]')) openDrawer(+e.target.dataset.i);
  if (e.key === 'Enter' && e.target.id === 'dtit') { e.preventDefault(); $('[data-act="saveTit"]').click(); }
});
$('#panel').addEventListener('change', e => {
  const el = e.target; if (!el.dataset.path) return;
  let v = el.value;
  if (el.type === 'number') v = v === '' ? null : +v;
  else if (el.tagName === 'SELECT' && /\.m$/.test(el.dataset.path)) v = +v;
  setPath(el.dataset.path, v);
  update(!!el.dataset.struct || el.tagName === 'SELECT');
});
let qT;
document.addEventListener('input', e => {
  if (e.target.id === 'q') { clearTimeout(qT); qT = setTimeout(() => { S.ui.q = e.target.value; save(); renderTable(); }, 180); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'lista') { S.ui.lista = e.target.value; save(); renderTable(); }
  if (e.target.id === 'show') { S.ui.show = e.target.value; save(); renderTable(); }
  if (e.target.id === 'dproj') { const i = drawerI; const p = AJ.people[i]; S.aj.edits[i] = Object.assign({}, S.aj.edits[i] || {}, { proj: e.target.checked ? 1 : 0 }); if (S.aj.edits[i].tit == null && S.aj.edits[i].proj === AJ0[i].proj0) delete S.aj.edits[i]; update(true); }
  if (e.target.id === 'dadia') { S.tec.adia[drawerI] = e.target.checked ? 1 : 0; update(true); }
});
$('#btnExport').addEventListener('click', () => {
  $('#mbox').innerHTML = `<h2 style="margin:0;font:720 18px var(--f-display)">Exportar cenário</h2><p class="note">Copie o texto e guarde. Para voltar a este cenário (em outro aparelho, por exemplo), use “Importar”.</p><textarea id="mtext" readonly>${esc(JSON.stringify(S))}</textarea><div class="actions"><button class="btn primary" data-act="copy">Copiar</button><button class="btn" data-act="mclose">Fechar</button></div>`;
  $('#modal').hidden = false;
});
$('#btnImport').addEventListener('click', () => {
  $('#mbox').innerHTML = `<h2 style="margin:0;font:720 18px var(--f-display)">Importar cenário</h2><p class="note">Cole o texto exportado ou escolha o arquivo .json.</p><input type="file" id="mfile" accept=".json,application/json,text/plain"><textarea id="mtext" placeholder="{ ... }"></textarea><div class="warnline" id="merr"></div><div class="actions"><button class="btn primary" data-act="doImport">Aplicar</button><button class="btn" data-act="mclose">Cancelar</button></div>`;
  $('#modal').hidden = false;
  $('#mfile').addEventListener('change', ev => { const f = ev.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('#mtext').value = rd.result; }; rd.readAsText(f); });
});
$('#btnReset').addEventListener('click', () => {
  $('#mbox').innerHTML = `<h2 style="margin:0;font:720 18px var(--f-display)">Restaurar o padrão?</h2><p>Volta às premissas e lotes das planilhas e apaga TDs, edições de títulos e marcações de adiamento, nos dois cargos.</p><div class="actions"><button class="btn warn" data-act="resetYes">Restaurar</button><button class="btn" data-act="mclose">Cancelar</button></div>`;
  $('#modal').hidden = false;
});

// ---------- início ----------
load();
recompute();
if (window.matchMedia('(min-width: 1001px)').matches) $('#panel').classList.remove('collapsed');
renderAll(true);
})();

</script>

</body>
</html>
